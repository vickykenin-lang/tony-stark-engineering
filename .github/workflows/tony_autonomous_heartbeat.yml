name: Tony Autonomous Heartbeat
# Governed automated diagnosis and safe recovery

on:
  push:
    branches: [main]
    paths:
      - 'src/autonomous_cycle.py'
      - 'tests/test_autonomous_cycle.py'
      - '.github/workflows/tony_autonomous_heartbeat.yml'
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tony-autonomous-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
      TONY_GITHUB_TOKEN: ${{ secrets.TONY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine heartbeat eligibility
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          run = True
          if os.environ.get('EVENT_NAME') == 'schedule' and os.environ.get('EVENT_SCHEDULE') == '47 * * * *':
              try:
                  state=json.load(open('state/autonomy_status.json', encoding='utf-8'))
                  run=state.get('incident_detected') is True
              except Exception:
                  run=False
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write(f"run={'true' if run else 'false'}\n")
          PY
      - name: Run autonomy tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Run autonomous diagnostic cycle
        if: steps.gate.outputs.run == 'true'
        run: python src/autonomous_cycle.py
      - name: Persist cycle evidence
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "tony-stark-autonomy"
          git config user.email "actions@users.noreply.github.com"
          git add state/autonomy_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist Tony autonomous heartbeat evidence"
          git pull --rebase --autostash
          git push
