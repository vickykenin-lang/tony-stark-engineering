# Credential health recheck trigger
name: Victor Tony Strict Transport

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Victor task ID
        required: true
        type: string
      task_type:
        description: Governed Tony task type
        required: true
        type: choice
        options:
          - STATUS_CHECK
          - HEALTH_CHECK
          - DIAGNOSTIC
          - REPAIR_PLAN
          - POST_REPAIR_VERIFY
          - TASK_REQUEST
      payload:
        description: JSON payload
        required: false
        default: '{}'
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'OBJECTIVE.md'
      - 'SOUL.md'
      - 'config/**'
      - 'integration/victor_contract.json'
      - '.github/workflows/victor_tony_transport.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run constitutional tests
        run: python -m unittest discover -s tests -v
      - name: Verify AWS Bedrock credential
        env:
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
        run: python src/bedrock_health.py
      - name: Verify Tony cross-repository access
        env:
          TONY_GITHUB_TOKEN: ${{ secrets.TONY_GITHUB_TOKEN }}
        run: python src/github_access_health.py
      - name: Persist AI health evidence
        if: always()
        run: |
          git config user.name "tony-stark-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add state/ai_runtime_status.json state/github_access_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist Tony AI runtime health"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt*2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo "Failed to persist Tony AI health after concurrency retries"
          exit 1

  execute:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TONY_TASK_ID: ${{ inputs.task_id }}
      TONY_TASK_TYPE: ${{ inputs.task_type }}
      TONY_TASK_PAYLOAD: ${{ inputs.payload }}
      TONY_TARGET_REPO_PATH: ${{ github.workspace }}/_target/rio-affiliate-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve governed target
        id: target
        if: inputs.task_type == 'TASK_REQUEST'
        env:
          RAW_PAYLOAD: ${{ inputs.payload }}
        run: |
          python - <<'PY'
          import json, os
          target = json.loads(os.environ["RAW_PAYLOAD"]).get("target_repository", "")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"repository={target}\n")
          PY
      - name: Checkout RIO read-only audit target
        if: steps.target.outputs.repository == 'vickykenin-lang/rio-affiliate-engine'
        uses: actions/checkout@v4
        with:
          repository: vickykenin-lang/rio-affiliate-engine
          path: _target/rio-affiliate-engine
          persist-credentials: false
          fetch-depth: 1
      - name: Execute governed Tony task
        id: execute_task
        continue-on-error: true
        run: python src/tony_runtime.py
      - name: Apply Five Whys cognitive post-processing when requested
        if: inputs.task_type == 'TASK_REQUEST' && steps.execute_task.outcome == 'success'
        run: python src/five_whys_postprocess.py
      - name: Validate strict revert envelope
        run: |
          python - <<'PY'
          import json, os
          path=f"integration/results/tasks/{os.environ['TONY_TASK_ID']}.json"
          data=json.load(open(path, encoding="utf-8"))
          strict=data.get("strict_supervision") or {}
          required=["status","objective_alignment","error_or_blocker","root_cause","solution","next_action","evidence","revert_to_victor","requires_follow_up"]
          missing=[key for key in required if key not in strict]
          if missing:
              raise SystemExit("STRICT_REVERT_MISSING:"+",".join(missing))
          if strict["revert_to_victor"] is not True or not strict["evidence"]:
              raise SystemExit("STRICT_REVERT_INVALID")
          if data.get("destructive_action_performed") is not False or data.get("paid_action_performed") is not False:
              raise SystemExit("UNAUTHORIZED_ACTION_CLAIM")
          objective=str((data.get('task_request') or {}).get('objective') or '')
          if 'FIVE_WHYS' in objective.upper() or 'FIVE-WHYS' in objective.upper():
              if strict.get('status') != 'FIVE_WHYS_DIAGNOSIS_COMPLETED':
                  raise SystemExit('FIVE_WHYS_NOT_EXECUTED')
              if not strict.get('why_chain'):
                  raise SystemExit('FIVE_WHYS_CHAIN_MISSING')
              if strict.get('next_action') == 'VICTOR_REVIEW_AUDIT_AND_AUTHORIZE_REPAIR_PLAN':
                  raise SystemExit('FIVE_WHYS_REPEATED_STALE_NEXT_ACTION')
          print("STRICT_TONY_REVERT_OK")
          PY
      - name: Persist evidence
        run: |
          git config user.name "tony-stark-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add integration/results/tasks/${TONY_TASK_ID}.json
          if [ -f integration/results/audits/${TONY_TASK_ID}.json ]; then
            git add integration/results/audits/${TONY_TASK_ID}.json
          fi
          if [ -f integration/results/plans/${TONY_TASK_ID}.json ]; then
            git add integration/results/plans/${TONY_TASK_ID}.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Persist Tony task evidence ${TONY_TASK_ID}"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt*2))
              continue
            fi
            if git push origin HEAD:main; then
              echo "Tony task evidence persisted"
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo "Failed to persist Tony task evidence after concurrency retries"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: victor-tony-result-${{ inputs.task_id }}
          path: |
            integration/results/tasks/${{ inputs.task_id }}.json
            integration/results/audits/${{ inputs.task_id }}.json
            integration/results/plans/${{ inputs.task_id }}.json
          if-no-files-found: error
      - name: Preserve fail-closed workflow conclusion
        if: steps.execute_task.outcome == 'failure'
        run: |
          echo "Tony task SAFE_STOP evidence was persisted for Victor review."
          exit 1
